<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04050A" />

    <title>Agence web à Asnières-sur-Seine (92) — Création de site &amp; automatisation</title>
    <meta
      name="description"
      content="SmartFixx, agence web à Asnières-sur-Seine (92) : création de site internet sur-mesure, refonte complète et automatisation de vos logiciels métiers. Première maquette en 48 h, devis ferme."
    />
    <link rel="canonical" href="https://smartfixx.fr/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="author" content="SmartFixx" />
    <link rel="alternate" hreflang="fr" href="https://smartfixx.fr/" />
    <link rel="alternate" hreflang="x-default" href="https://smartfixx.fr/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="SmartFixx" />
    <meta property="og:url" content="https://smartfixx.fr/" />
    <meta
      property="og:title"
      content="Agence web à Asnières-sur-Seine (92) — Création de site &amp; automatisation"
    />
    <meta
      property="og:description"
      content="Sites web sur-mesure, refontes complètes et automatisation de vos logiciels métiers. Si une tâche revient chaque semaine, elle peut disparaître."
    />
    <meta property="og:image" content="https://smartfixx.fr/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SmartFixx — on conçoit, on refond, on automatise." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Agence web à Asnières-sur-Seine (92) — Création de site &amp; automatisation"
    />
    <meta
      name="twitter:description"
      content="Sites web sur-mesure, refontes complètes et automatisation de vos logiciels métiers."
    />
    <meta name="twitter:image" content="https://smartfixx.fr/og-image.png" />

    <!-- Polices auto-hébergées (voir scripts/fetch-fonts.mjs) : aucune requête tierce. -->
    <link
      rel="preload"
      href="/fonts/space-grotesk-600-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <!--
      Le HTML de la page est pré-généré au build : il s'affiche donc avant que le
      JavaScript ne s'exécute. Sans ce voile, le visiteur verrait le contenu une
      fraction de seconde puis le préchargeur le recouvrir. Il est posé hors de
      #root pour que React n'y touche pas, et retiré par le préchargeur.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 400;
        background: #04050a;
      }
      #boot.is-gone {
        display: none;
      }
    </style>
    <div id="boot" aria-hidden="true"></div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
